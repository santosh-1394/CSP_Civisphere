
{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width:700px; margin:40px auto;">

    <h1>Register as a Blood Donor</h1>
    <p>Help save lives by voluntarily registering as a blood donor.</p>

    <form method="POST"
          action="{{ url_for('donors.register_donor') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="margin-bottom:20px;">
            <label for="donor_name">Full Name *</label>
            <input type="text"
                   id="donor_name"
                   name="donor_name"
                   maxlength="100"
                   required
                   style="width:100%; padding:12px; margin-top:8px;">
        </div>

        <div style="margin-bottom:20px;">
            <label for="blood_group">Blood Group *</label>
            <select id="blood_group"
                    name="blood_group"
                    required
                    style="width:100%; padding:12px; margin-top:8px;">

                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>
        </div>

        <div style="margin-bottom:20px;">
            <label for="phone">Phone Number *</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   maxlength="15"
                   required
                   placeholder="Enter your phone number"
                   style="width:100%; padding:12px; margin-top:8px;">
        </div>

        <div style="margin-bottom:20px;">
            <label for="location">Location *</label>
            <input type="text"
                   id="location"
                   name="location"
                   maxlength="150"
                   required
                   placeholder="Enter your area or village"
                   style="width:100%; padding:12px; margin-top:8px;">
        </div>

        <div style="margin-bottom:20px;">
            <label>
                <input type="checkbox"
                       name="consent"
                       value="yes"
                       required>
                I voluntarily agree to be contacted regarding blood donation.
            </label>
        </div>

        <button type="submit" style="padding:12px 25px;">
            Register as Donor
        </button>

        <a href="{{ url_for('donors.donor_list') }}"
           style="margin-left:15px;">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
